[project]
name = "agent-verification-testbed"
version = "0.1.0"
description = "Reproducible evaluation of trajectory selection methods for Terminal-Bench agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jj-link" }]
dependencies = []

[project.scripts]
avt = "avt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avt"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["avt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
