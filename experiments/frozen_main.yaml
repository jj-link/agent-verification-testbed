# FROZEN MAIN STUDY CONFIGURATION — v1.0 (do not modify after tagging)
#
# Every experimental decision is frozen here per plan §26. Changing any field
# invalidates experiment-v1.0; create a new tag and rerun consistently.

experiment:
  name: main-v1
  seed: 42
  task_file: experiments/main_tasks.txt        # 25 tasks (smoke+pilot subset)
  candidates_per_task: 5
  max_parallel: 4

upstream:
  # Frozen upstream commits.
  terminal_bench_commit: 69671fbaac6d67a7ef0dfec016cc38a64ef7a77c
  harbor_commit: 4407eb5227a2ff4f0d3f16b2eb48849382fdf276

generator:
  # Local RTX 6000 Pro deployment (qwen3.8-27b-6000pro). host.docker.internal
  # resolves for the in-container qwen-code actor.
  harness: qwen-coder
  model: qwen3.8-27b-6000pro
  endpoint: http://host.docker.internal:8000/v1
  temperature: 0.7
  max_tokens: 8192
  timeout_multiplier: 1.0
  context_window: 200000
  agent_version: "0.22.0"
  # Six graded smoke trajectories completed within 53 tool calls / 407 seconds.
  # Bound unattended stochastic outliers with margin instead of disabling timeout.
  max_wall_time_seconds: 900
  max_tool_calls: 64
  skip_loop_detection: false

verifier:
  model: qwen3.8-27b-6000pro
  endpoint: http://host.docker.internal:8000/v1
  criteria:
    - specification
    - output
    - errors
  # G=5 (labels A..E). Plan 13.2 forbids silent zero-fill of a missing label, and
  # this model does not reliably emit all 20 letters (G=20) in its top-logprobs,
  # so G=5 is the granularity at which every label is reliably present and the
  # verifier is plan-compliant. G=20 remains a documented ablation requiring
  # forced-token scoring (plan 26 ablation list).
  granularity: 5
  repetitions: 1
  max_tokens: 16
  top_logprobs: 300
  prompt_version: score-label-map-v2

rendering:
  max_pair_context_tokens: 120000
  oversized_output_policy: head_tail

ranking:
  method: round_robin_bradley_terry
  minimum_pair_coverage: 1.0

storage:
  # Single-engine WSL execution: Harbor job dirs, artifacts, and SQLite stay on
  # native ext4. DrvFS (/mnt/c) produced EIO during concurrent artifact writes.
  root: /home/workbench/avt-data/main-v1/
  metadata_db: /home/workbench/avt-data/main-v1/experiment.sqlite
  ground_truth_db: /home/workbench/avt-data/main-v1/ground_truth.sqlite

